name: Lineaje Stub and Guardrail

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository to remediate (blank = this repository)"
        required: false
        default: ""
      ref:
        description: "Branch, tag, or SHA to scan (blank = default branch)"
        required: false
        default: ""
      mcp_server_url:
        description: "Lineaje MCP endpoint"
        required: true
        default: "https://mcp.commercialdev.dev.veedna.com/mcp"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lineaje-stub-guardrail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-stub-and-guardrail-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v4
        with:
          path: scanner

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo || github.repository }}
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: python -m pip install "mcp==1.27.1"

      - name: Resolve target metadata
        id: target
        env:
          INPUT_REPO: ${{ inputs.target_repo }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          repo="${INPUT_REPO:-$GITHUB_REPOSITORY}"
          branch="$INPUT_REF"
          if [ -z "$branch" ]; then
            branch="$(git -C target branch --show-current)"
          fi
          if [ -z "$branch" ]; then
            branch="detached"
          fi

          {
            echo "repo=$repo"
            echo "branch=$branch"
            echo "head_sha=$(git -C target rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate stub and guardrail remediation PR
        env:
          LINEAJE_PAT_TOKEN: ${{ secrets.LINEAJE_COMMERCIALDEV_PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          MCP_SERVER_URL: ${{ inputs.mcp_server_url }}
        run: |
          set -euo pipefail

          if [ -z "$LINEAJE_PAT_TOKEN" ]; then
            echo "::error::Repository secret LINEAJE_COMMERCIALDEV_PAT_TOKEN is not configured"
            exit 1
          fi

          python scanner/.github/gha_repo_scan.py \
            --source-path target \
            --repo "${{ steps.target.outputs.repo }}" \
            --branch "${{ steps.target.outputs.branch }}" \
            --head-sha "${{ steps.target.outputs.head_sha }}" \
            --mcp-server-url "$MCP_SERVER_URL" \
            --create-fix-pr \
            | tee scan_result.txt

      - name: Publish job summary
        if: always()
        run: |
          if [ -f scan_result.txt ]; then
            cat scan_result.txt >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Lineaje Stub and Guardrail' '' 'No scan result was generated.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan result
        if: always() && hashFiles('scan_result.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lineaje-stub-guardrail-result
          path: scan_result.txt
          if-no-files-found: ignore
